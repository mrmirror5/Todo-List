<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
    <link rel="stylesheet" href="styles.css">

    <audio id="task-done-audio">
        <source src="audio/jobs_done.mp3" type="audio/mpeg">
    </audio>
    <audio id="task-not-done-audio">
        <source src="audio/sound-fail-fallo.mp3" type="audio/mpeg">
    </audio>
</head>
<body>
    <div class="head-box">TODO List</div>
    <div class="add-field">
        <input type="text" placeholder="Type a task..." id="input-box" class="input-box">
        <button class="add-button" id="add-button">Add</button>
    </div>
    <div class="task-bucket" id="task-bucket">
        
        <div class="task-body">
            <div class="task">
                <p>Task text here</p>
            </div>
            <div class="basic-button rm-button">
                Remove
            </div>
            <div class="basic-button done-button">
                Done
            </div>       
        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
